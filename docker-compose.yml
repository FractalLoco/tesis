# docker compose up --build -d  ->  http://localhost:8020

services:

  # la base de datos
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: tesis-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DOCKER_CLAVE_POSTGRES:-postgres_local}
      CLAVE_SOLO_LECTURA: ${DOCKER_CLAVE_SOLO_LECTURA:-solo_lectura_local}
    # los datos no se pierden al apagar
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    # solo desde este PC
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      retries: 60

  # la página y la API
  app:
    build: .
    container_name: tesis-app
    restart: unless-stopped
    # espera a que la base esté lista
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: optimizacion
      DB_USER: analizador_ro
      DB_PASSWORD: ${DOCKER_CLAVE_SOLO_LECTURA:-solo_lectura_local}
      PRECARGAR_CONEXION: ${DOCKER_PRECARGAR:-true}
      CORS_ORIGINS: ${DOCKER_CORS:-http://localhost:8020,http://127.0.0.1:8020}
      GEMELA_DSN: host=db port=5432 dbname=postgres user=postgres password=${DOCKER_CLAVE_POSTGRES:-postgres_local}
    # afuera 8020, adentro 8000; solo este PC salvo DOCKER_IP=0.0.0.0 (red)
    ports:
      - "${DOCKER_IP:-127.0.0.1}:${DOCKER_PUERTO:-8020}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      retries: 5

volumes:
  datos_postgres:
