name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint (ruff)
        run: ruff check backend analizador || true
      - name: Compilar (chequeo de sintaxis)
        run: python -m compileall backend analizador
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Chequeo de sintaxis de los módulos ES
        run: |
          for f in $(find frontend/js -name "*.js"); do
            cp "$f" /tmp/chk.mjs
            node --check /tmp/chk.mjs || exit 1
          done
          echo "Todos los módulos JS OK"
