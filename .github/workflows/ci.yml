name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "ruff==0.16.*"
      # Reglas clásicas de ruff (errores de sintaxis, imports y variables sin
      # usar, nombres no definidos). Si encuentra errores, el CI falla.
      - name: Lint (ruff)
        run: ruff check --select E4,E7,E9,F backend analizador tests
      - name: Compilar (chequeo de sintaxis)
        run: python -m compileall -q backend analizador
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Chequeo de sintaxis de los módulos ES
        run: |
          for f in $(find frontend/js -name "*.js"); do
            cp "$f" /tmp/chk.mjs
            node --check /tmp/chk.mjs || exit 1
          done
          echo "Todos los módulos JS OK"

  deploy:
    name: Desplegar al servidor
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Sin los secrets DEPLOY_* (por ejemplo, en un fork) se omite el despliegue
      # en vez de marcar el CI como fallido.
      - name: Verificar configuración del servidor
        id: config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Despliegue omitido: faltan los secrets DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER y DEPLOY_PASSWORD."
          fi
      - name: Actualizar y reiniciar en el servidor
        if: steps.config.outputs.listo == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUDO_PASS: ${{ secrets.DEPLOY_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          # La contraseña llega como variable de entorno y no queda escrita en el script.
          envs: SUDO_PASS
          script: |
            set -e
            cd ~/app
            git pull
            venv/bin/pip install -q -r requirements.txt
            printf '%s\n' "$SUDO_PASS" | sudo -S pkill -f "uvicorn backend.main:app" || true
            sleep 1
            printf '%s\n' "$SUDO_PASS" | sudo -S setsid bash -c \
              'cd ~/app && venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 80 > server.log 2>&1 < /dev/null &'
            sleep 2
            python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1/health', timeout=5).read().decode())"
