name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "ruff==0.16.*"
      # Reglas clásicas de ruff (errores de sintaxis, imports y variables sin
      # usar, nombres no definidos). Si encuentra errores, el CI falla.
      - name: Lint (ruff)
        run: ruff check --select E4,E7,E9,F backend analizador tests
      - name: Compilar (chequeo de sintaxis)
        run: python -m compileall -q backend analizador
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Chequeo de sintaxis de los módulos ES
        run: |
          for f in $(find frontend/js -name "*.js"); do
            cp "$f" /tmp/chk.mjs
            node --check /tmp/chk.mjs || exit 1
          done
          echo "Todos los módulos JS OK"

  # Corre en el runner propio instalado en el servidor de la universidad (que
  # solo es accesible por VPN): el servidor busca los trabajos en GitHub, así que
  # no hace falta abrir SSH ni guardar contraseñas en el repositorio.
  deploy:
    name: Desplegar al servidor
    runs-on: [self-hosted, servidor-ubb]
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: produccion
      url: http://146.83.198.35:1659
    steps:
      - name: Actualizar el código
        run: |
          cd ~/app
          git fetch origin main
          git reset --hard origin/main
      - name: Instalar dependencias
        run: ~/app/venv/bin/pip install -q -r ~/app/requirements.txt
      - name: Reiniciar la aplicación
        run: |
          pkill -f "uvicorn backend.main:app" || true
          sleep 1
          cd ~/app
          # RUNNER_TRACKING_ID vacío: evita que el runner cierre la app al
          # terminar el job (por defecto mata los procesos que deja el paso).
          RUNNER_TRACKING_ID="" PYTHONDONTWRITEBYTECODE=1 setsid             venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 80             > ~/app.log 2>&1 < /dev/null &
      - name: Verificar que responde
        run: |
          for i in $(seq 1 15); do
            if python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1/health', timeout=2).read().decode())"; then
              exit 0
            fi
            sleep 1
          done
          echo "La aplicación no respondió. Últimas líneas del log:"
          tail -n 30 ~/app.log
          exit 1
