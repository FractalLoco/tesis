name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint (ruff)
        run: ruff check backend analizador || true
      - name: Compilar (chequeo de sintaxis)
        run: python -m compileall backend analizador
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Chequeo de sintaxis de los módulos ES
        run: |
          for f in $(find frontend/js -name "*.js"); do
            cp "$f" /tmp/chk.mjs
            node --check /tmp/chk.mjs || exit 1
          done
          echo "Todos los módulos JS OK"

  deploy:
    name: Desplegar al servidor
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Actualizar y reiniciar en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd ~/app
            git pull
            venv/bin/pip install -q -r requirements.txt
            echo "${{ secrets.DEPLOY_PASSWORD }}" | sudo -S pkill -f "uvicorn backend.main:app" || true
            sleep 1
            echo "${{ secrets.DEPLOY_PASSWORD }}" | sudo -S setsid bash -c \
              'cd ~/app && venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 80 > server.log 2>&1 < /dev/null &'
            sleep 2
            python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1/health', timeout=5).read().decode())"
